<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              900: '#0a0a12',
              800: '#12121d',
              700: '#1a1a28',
            },
            accent: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          },
          animation: {
            'fade-in': 'fadeIn 150ms ease-out',
            'fade-out': 'fadeOut 150ms ease-in'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            fadeOut: { '0%': { opacity: '1' }, '100%': { opacity: '0' } }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      @apply bg-primary-900 text-gray-200 font-sans;
      font-family: 'Inter', sans-serif;
    }
    .content-area {
      height: calc(100vh - 64px);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      @apply bg-primary-800;
    }
    ::-webkit-scrollbar-thumb {
      @apply bg-primary-700 rounded-full;
    }
    .file-item {
      transition: background-color 100ms ease-out;
    }
    .file-item:hover {
      @apply bg-primary-800;
    }
  </style>
</head>
<body class="antialiased">
  <div class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-primary-800 border-b border-primary-700 px-6 flex items-center justify-center" style="min-height:72px;">
  <h1 class="text-3xl font-extrabold text-accent-500 tracking-wider text-center" style="font-family: 'Inter', sans-serif; letter-spacing:0.03em;">Documentation Explorer</h1>
</header>
    
    <!-- Main Content -->
    <main class="flex flex-1 overflow-hidden">
      <!-- Sidebar -->
      <div class="w-64 bg-primary-800 border-r border-primary-700 flex flex-col">
        <!-- Upload Section -->
        <div class="p-4 border-b border-primary-700">
          <label class="block mb-4 text-lg font-bold text-accent-500 tracking-wide text-center w-full" style="font-family: 'Inter', sans-serif;">Upload Project</label>
          <div class="relative">
            <input 
              type="file" 
              id="project-upload" 
              webkitdirectory 
              directory 
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
            >
            <div class="flex items-center justify-center gap-2 px-3 py-1.5 bg-primary-800 rounded-lg border-2 border-blue-400 hover:bg-primary-700 text-blue-400 transition-colors shadow mt-2 mb-2">
  <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10" />
  </svg>
  <span class="text-sm font-semibold tracking-wide" style="font-family: 'Inter', sans-serif;">Select Folder</span>
</div>
          </div>
        </div>
        
        <!-- File Browser -->
        <div class="flex-1 overflow-y-auto">
          <div class="p-4 border-b border-primary-700 flex items-center justify-between">
            <h2 class="text-lg font-bold text-accent-500 tracking-wide mb-2 text-center w-full" style="font-family: 'Inter', sans-serif;">Documentations</h2>
            <button id="refresh-files" class="text-gray-400 hover:text-white p-1 rounded-full hover:bg-primary-700 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
            </button>
          </div>
          <div id="output-files" class="divide-y divide-primary-700 text-sm">
            <!-- Files will be populated here -->
          </div>
        </div>
      </div>
      
      <!-- Content Area -->
      <div class="flex-1 flex flex-col bg-primary-900">
        <!-- Toolbar -->
        
        
        <!-- Markdown Content -->
        <div id="markdown-content" class="flex-1 overflow-y-auto p-6 content-area">
          <div class="max-w-4xl mx-auto prose prose-invert prose-sm md:prose-base">
            <!-- Content will be rendered here -->
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Toast Notification (hidden by default) -->
  <div id="toast" class="fixed bottom-4 right-4 px-4 py-2 rounded-md shadow-lg bg-primary-800 border border-primary-700 text-sm font-medium hidden"></div>
  
  <script src="./assets/js/app.js"></script>
</body>
</html>
