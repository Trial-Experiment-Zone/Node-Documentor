<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Documentation Explorer</title>
  
  <!-- Bootstrap + SB-Admin CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/styles.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
  
  <style>
    :root {
      --sidebar-width: 300px;
      --header-height: 60px;
      --primary: #4e73df;
      --light: #f8f9fc;
    }
    
    body {
      background-color: var(--light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .app-header {
      height: var(--header-height);
      box-shadow: 0 0.15rem 1.75rem 0 rgba(33, 40, 50, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .app-sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: white;
      box-shadow: 0 0.15rem 1.75rem 0 rgba(33, 40, 50, 0.15);
      height: calc(100vh - var(--header-height));
      overflow-y: auto;
      position: sticky;
      top: var(--header-height);
      transition: transform 0.3s ease;
    }
    
    .app-content {
      flex: 1;
      overflow: auto;
      height: calc(100vh - var(--header-height));
      padding: 1.5rem;
    }
    
    .file-item {
      transition: all 0.2s;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .doc-preview {
      background: white;
      border-radius: 0.35rem;
      box-shadow: 0 0.15rem 1.75rem 0 rgba(33, 40, 50, 0.15);
      max-width: 100%;
      overflow: hidden;
    }
    
    #markdown-content {
      max-width: 100%;
      overflow-x: auto;
    }
    
    #code-content {
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .btn-icon {
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    
    .btn-icon:hover {
      color: var(--primary) !important;
      background: rgba(78, 115, 223, 0.1) !important;
    }
    
    #refresh-structure.btn-icon:hover {
      background: transparent !important;
      color: inherit !important;
    }
    
    #toggle-view {
      border: none;
      background: transparent;
    }
    
    @media (max-width: 768px) {
      .app-sidebar {
        position: fixed;
        transform: translateX(-100%);
        z-index: 100;
      }
      
      .app-sidebar.show {
        transform: translateX(0);
      }
      
      .app-content {
        margin-left: 0;
      }
    }
  </style>
</head>

<body class="sb-nav-fixed">
  <!-- Header with mobile menu toggle -->
  <header class="app-header navbar navbar-dark bg-primary">
    <div class="container-fluid px-4">
      <button class="navbar-toggler d-md-none me-2 btn-icon" type="button" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <span class="navbar-brand d-flex align-items-center">
        <i class="fas fa-book-open fa-fw me-2"></i>
        <span class="fw-bold">Documentation Explorer</span>
      </span>
      <div class="d-flex">
        <input id="project-upload" type="file" webkitdirectory directory class="d-none">
        <label for="project-upload" class="btn btn-sm btn-light ms-2">
          <i class="fas fa-upload fa-fw me-2"></i>Upload Project
        </label>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="app-container">
    <!-- Sidebar -->
    <nav class="app-sidebar">
      <div class="sidebar-header d-flex align-items-center justify-content-between px-4 py-3">
        <h5 class="mb-0 fw-bold text-primary">
          <i class="fas fa-folder-open me-2"></i>Projects
        </h5>
        <button id="refresh-structure" class="btn btn-link text-dark" title="Refresh">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
      <div id="file-tree" class="sidebar-body px-3 py-2">
        <!-- Dynamic content -->
      </div>
    </nav>

    <!-- Content Area -->
    <main class="app-content">
      <div class="doc-preview mb-4">
        <div class="card-header d-flex justify-content-between align-items-center py-3 px-4">
          <h5 class="mb-0 text-primary">
            <i class="fas fa-file-alt me-2"></i>
            <span id="file-title">Select a file</span>
          </h5>
          <div class="d-flex">
            <button id="toggle-view" class="btn btn-link text-dark" title="Toggle View">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div id="markdown-content" class="card-body p-4">
          <div id="empty-state" class="py-5 text-center">
            <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
            <h5 class="text-muted">No file selected</h5>
            <p class="text-muted">Select a file from the project tree to view its contents</p>
          </div>
          <!-- Plain text view (hidden by default) -->
          <div id="plain-view" class="flex-fill overflow-auto p-3 bg-white" style="display: none;">
            <pre id="plain-text-content" class="m-0"></pre>
          </div>
          <!-- Rendered view (for markdown/mermaid) -->
          <div id="rendered-view" class="flex-fill overflow-auto p-3 bg-white">
            <!-- Zoom controls (shown only for mermaid diagrams) -->
            <div class="position-absolute top-0 end-0 m-3 btn-group" id="zoom-controls" style="display: none;">
              <button id="zoom-in" class="btn btn-sm btn-outline-secondary" title="Zoom In">
                <i class="fas fa-search-plus"></i>
              </button>
              <button id="zoom-out" class="btn btn-sm btn-outline-secondary" title="Zoom Out">
                <i class="fas fa-search-minus"></i>
              </button>
              <button id="zoom-reset" class="btn btn-sm btn-outline-secondary" title="Reset Zoom">
                <i class="fas fa-expand"></i>
              </button>
            </div>
            <div id="markdown-container"></div>
          </div>
          <div id="code-view" class="flex-fill overflow-auto p-3 bg-light font-monospace d-none">
            <pre id="code-content" class="m-0"></pre>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function toggleSidebar() {
      document.querySelector('.app-sidebar').classList.toggle('show');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
