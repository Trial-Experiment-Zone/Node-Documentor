<!-- src/web-ui/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Documentation Explorer</title>
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-primary-900 text-blue-400">
  <div class="flex flex-col h-screen">
    <header class="p-4 bg-primary-800 border-b border-primary-700">
      <h1 class="text-2xl font-bold text-accent-500" style="font-family: 'Inter', sans-serif;">
        Documentation Explorer
      </h1>
    </header>
    <main class="flex flex-1 overflow-hidden">
      <!-- File Manager Sidebar -->
      <aside class="w-64 bg-primary-800 border-r border-primary-700 flex flex-col">
        <div class="p-4 border-b border-primary-700 flex items-center justify-between">
          <h2 class="text-lg font-bold text-accent-500">Project Structure</h2>
          <button id="refresh-structure" class="text-gray-400 hover:text-white p-1 rounded-full hover:bg-primary-700 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.581m15.362 2A8.003 8.003 0 014.582 9m0 0H9
                       m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>
        <div id="file-tree" class="flex-1 overflow-y-auto p-2 text-sm divide-y divide-primary-700"></div>
      </aside>

      <!-- Content Area -->
      <section class="flex-1 flex flex-col bg-primary-900">
        <div class="p-4 border-b border-primary-700 flex items-center justify-between">
          <span id="file-title" class="text-lg font-semibold text-accent-500">Select a file to view</span>
          <label for="project-upload" class="cursor-pointer">
            <input id="project-upload" type="file" webkitdirectory directory class="hidden">
            <span class="flex items-center px-4 py-2 bg-primary-800 rounded-md text-blue-400 hover:bg-primary-700 border border-blue-400 transition-colors">
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0
                         011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
              </svg>
              Upload
            </span>
          </label>
        </div>
        <div id="markdown-content" class="flex-1 overflow-y-auto p-6 content-area">
          <div class="max-w-4xl mx-auto prose prose-invert prose-sm md:prose-base"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="fixed bottom-4 right-4 px-4 py-2 rounded-md shadow-lg bg-primary-800 border border-primary-700 text-sm font-medium hidden"></div>
  <script src="./assets/js/app.js"></script>
</body>
</html>
